[package]
name = "shhdrop-jetons-wasm"
version = "0.1.0"
description = "Liaison WebAssembly des jetons anonymes des offres payantes (Privacy Pass), module à part du moteur des partages"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
shhdrop-core = { path = "../core", features = ["jetons"] }
# Mêmes versions exactes que les deux autres liaisons (wasm-bindgen-cli 0.2.130).
wasm-bindgen = "=0.2.130"
js-sys = "=0.3.107"

# blind-rsa-signatures tire son aléa par getrandom, qui lit crypto.getRandomValues dans le
# navigateur (WebCrypto, comme le reste du site) ; même version exacte que le salon.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.4.3", default-features = false, features = ["wasm_js"] }
