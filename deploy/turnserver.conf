# Relais TURN des appels audio et vidéo du salon (coturn 4.6 ; conception :
# docs/superpowers/specs/2026-11-20-appels-design.md). Installé sur la machine (apt install
# coturn), PAS dans la pile Docker : le relais doit voir les vraies adresses et ouvrir une
# plage de ports UDP. Mise en place : deploy/README.md §14.
#
# Ce que le relais voit : les adresses IP des deux bouts et des paquets chiffrés (DTLS-SRTP de
# bout en bout entre participants). Il ne voit ni le son, ni l'image, ni qui parle à qui dans
# quel salon (identifiants temporaires sans identité). Il ne garde rien : aucun journal.
#
# Modèle : copié en /etc/turnserver.conf (propriétaire turnserver, mode 0600), puis <IP_PUBLIQUE>
# (trois fois) et <SECRET> remplacés sur la machine. Le secret n'est jamais commité.

listening-port=3478
tls-listening-port=5349
listening-ip=<IP_PUBLIQUE>
relay-ip=<IP_PUBLIQUE>
realm=shhgone.com
fingerprint

# Identifiants temporaires calculés par le serveur Go avec le même secret (6 h au plus).
# <SECRET> : 48 caractères aléatoires (openssl rand -hex 24), les mêmes que dans le fichier
# SHH_TURN_SECRET_FILE du serveur (README §14).
use-auth-secret
static-auth-secret=<SECRET>

# Aucune adresse IP sur disque (règle du projet) : aucun journal, nulle part.
no-stdout-log
log-file=/dev/null
syslog=false
no-cli
no-rfc5780
no-stun-backward-compatibility

# Le relais ne doit jamais servir de rebond vers la machine ni vers un réseau privé :
# seules des adresses publiques sont jointes (les deux participants passent tous deux par
# <IP_PUBLIQUE>, autorisée ci-dessous).
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
allowed-peer-ip=<IP_PUBLIQUE>

# Bornes : un appel à 6 en vidéo demande environ 15 Mbit/s au relais (30 flux de 500 kbit/s).
# max-bps et bps-capacity sont en octets par seconde : 2 Mbit/s par session, 60 Mbit/s en tout : au-delà, les appels se dégradent au lieu de
# saturer la machine. Plage de ports relais : à ouvrir en UDP dans le pare-feu.
min-port=49160
max-port=49999
max-bps=250000
bps-capacity=7500000
total-quota=300
user-quota=12
stale-nonce=600

# TLS (port 5349, pour les réseaux qui bloquent l'UDP) : certificat du nom du relais.
# cert=/etc/coturn/tls/fullchain.pem
# pkey=/etc/coturn/tls/privkey.pem
no-tlsv1
no-tlsv1_1
